<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEABAEK_LAB</title>
    <meta name="description" content="TEABAEK_LAB — 노션과 실시간 연동되는 공부 기록 블로그">
    <link rel="icon" href="/favicon.png?v=1">
    <link rel="apple-touch-icon" href="/favicon.png?v=1">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .code-font { font-family: 'Fira Code', monospace; }
        /* 모바일: 돋보기를 누르면 헤더 아래에 검색창이 펼쳐진다 */
        @media (max-width: 767px) {
            #searchWrap.search-open { display: block; position: absolute; left: .75rem; right: .75rem; top: 100%; margin-top: .5rem; }
            #searchWrap.search-open #searchInput { width: 100%; }
        }
        mark { background: rgba(16,185,129,.28); color: inherit; border-radius: 3px; padding: 0 2px; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        .dark ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; }
        .light ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-zinc-100 text-zinc-900 dark:bg-zinc-950 dark:text-zinc-100 transition-colors duration-300 min-h-screen flex flex-col justify-between">

    <header class="sticky top-0 z-40 backdrop-blur-md bg-white/85 dark:bg-zinc-950/85 border-b border-zinc-200 dark:border-zinc-800 transition-colors">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="resetToHome()">
                <div class="w-10 h-10 rounded-xl bg-zinc-900 border border-emerald-500/40 flex items-center justify-center text-emerald-400 shadow-[0_0_15px_rgba(16,185,129,0.2)]">
                    <i class="fa-solid fa-terminal text-lg"></i>
                </div>
                <div>
                    <span class="font-bold text-lg tracking-tight code-font block leading-tight">TEABAEK<span class="text-emerald-500">_LAB</span></span>
                    <span class="hidden sm:block text-xs text-zinc-500 dark:text-zinc-400">Notion Synced Portfolio</span>
                </div>
            </div>
            <div class="flex items-center space-x-2 md:space-x-4">
                <!-- 검색 -->
                <div id="searchWrap" class="relative hidden md:block">
                    <div class="relative">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-xs text-zinc-400 pointer-events-none"></i>
                        <input id="searchInput" type="search" autocomplete="off" spellcheck="false" placeholder="검색  ( / )" aria-label="검색"
                            class="w-40 focus:w-64 transition-all duration-200 pl-8 pr-3 py-2 rounded-xl bg-zinc-200 dark:bg-zinc-900 border border-zinc-300 dark:border-zinc-800 text-sm text-zinc-900 dark:text-zinc-100 placeholder-zinc-500 focus:outline-none focus:border-emerald-500">
                    </div>
                    <div id="searchPanel" class="hidden absolute right-0 top-full mt-2 w-[min(92vw,34rem)] max-h-[70vh] overflow-y-auto rounded-2xl bg-white dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 shadow-2xl z-50">
                        <div id="searchStatus" class="px-4 py-2 text-xs text-zinc-500 border-b border-zinc-100 dark:border-zinc-800/60"></div>
                        <div id="searchResults"></div>
                    </div>
                </div>
                <button id="searchToggle" type="button" onclick="toggleMobileSearch(event)" class="md:hidden w-10 h-10 rounded-xl bg-zinc-200 dark:bg-zinc-900 border border-zinc-300 dark:border-zinc-800 flex items-center justify-center text-zinc-700 dark:text-zinc-300 hover:border-emerald-500/50 transition cursor-pointer" aria-label="검색">
                    <i class="fa-solid fa-magnifying-glass text-sm"></i>
                </button>

                <nav class="flex items-center space-x-1 sm:space-x-4 text-sm font-medium text-zinc-600 dark:text-zinc-400">
                    <button onclick="openAbout()" class="px-2 py-2 hover:text-emerald-500 dark:hover:text-emerald-400 transition bg-transparent border-none cursor-pointer" aria-label="About">
                        <span class="hidden sm:inline">About</span><i class="fa-regular fa-user sm:hidden"></i>
                    </button>
                    <div id="catWrap" class="relative">
                        <button id="catBtn" type="button" onclick="toggleCategoryMenu(event)" aria-haspopup="true" aria-expanded="false" aria-label="Categories" class="px-2 py-2 hover:text-emerald-500 dark:hover:text-emerald-400 transition bg-transparent border-none cursor-pointer flex items-center space-x-1.5">
                            <span class="hidden sm:inline">Categories</span><i class="fa-solid fa-folder-tree sm:hidden"></i>
                            <i class="fa-solid fa-chevron-down text-[9px]"></i>
                        </button>
                        <div id="catMenu" class="hidden absolute right-0 top-full mt-2 w-64 max-h-[70vh] overflow-y-auto p-2 rounded-2xl bg-white dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 shadow-2xl z-50"></div>
                    </div>
                </nav>
                <button id="themeToggle" onclick="toggleTheme()" class="w-10 h-10 rounded-xl bg-zinc-200 dark:bg-zinc-900 border border-zinc-300 dark:border-zinc-800 flex items-center justify-center text-zinc-700 dark:text-emerald-400 hover:border-emerald-500/50 transition shadow-sm" aria-label="테마 전환">
                    <i id="themeIcon" class="fa-solid fa-moon text-sm"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-5xl mx-auto px-6 py-10 w-full">
        <section id="about" class="mb-12 p-8 rounded-3xl bg-white dark:bg-zinc-900/50 border border-zinc-200 dark:border-zinc-800 shadow-sm relative overflow-hidden">
            <div class="absolute -right-10 -bottom-10 w-48 h-48 bg-emerald-500/5 rounded-full blur-3xl pointer-events-none"></div>
            <div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-6">
                <div>
                    <div class="inline-flex items-center space-x-2 px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-600 dark:text-emerald-400 text-xs font-semibold code-font mb-4">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                        <span>NOTION DB SYNC ACTIVE</span>
                    </div>
                    <h1 class="text-3xl md:text-4xl font-bold tracking-tight mb-3">공부 기록 포트폴리오 블로그</h1>
                    <p class="text-zinc-600 dark:text-zinc-400 text-sm md:text-base leading-relaxed max-w-2xl">
                        노션(Notion) 데이터베이스와 실시간 연동되는 개인 보안 포트폴리오입니다.
                    </p>
                </div>
                <div class="flex flex-col space-y-2 text-xs code-font bg-zinc-50 dark:bg-zinc-950 p-4 rounded-2xl border border-zinc-200 dark:border-zinc-800 text-zinc-600 dark:text-zinc-400 min-w-[240px]">
                    <div class="flex justify-between"><span>SYNC MODE:</span> <span class="text-emerald-500 font-semibold" id="syncStatus">Connecting...</span></div>
                    <div class="flex justify-between"><span>POSTS:</span> <span class="text-zinc-800 dark:text-zinc-200" id="postCount">-</span></div>
                    <button onclick="loadPosts(true)" class="mt-2 text-center py-1.5 px-3 bg-emerald-500/20 hover:bg-emerald-500/30 text-emerald-600 dark:text-emerald-400 rounded-xl transition font-semibold cursor-pointer">
                        <i class="fa-solid fa-rotate mr-1"></i>새로고침
                    </button>
                </div>
            </div>
        </section>

        <div id="contentArea"></div>
    </main>

    <div id="postModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm hidden p-4">
        <div class="bg-white dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 rounded-3xl max-w-2xl w-full max-h-[85vh] flex flex-col shadow-2xl overflow-hidden transition-all duration-200" id="modalPanel">
            <div class="px-6 py-4 border-b border-zinc-200 dark:border-zinc-800 flex items-center justify-between bg-zinc-50 dark:bg-zinc-900/40">
                <div class="flex items-center space-x-2">
                    <span id="modalCategory" class="px-2.5 py-1 rounded-lg bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 text-xs font-semibold code-font"></span>
                    <span id="modalDate" class="text-xs text-zinc-500"></span>
                </div>
                <div class="flex items-center space-x-2">
                    <button id="sizeToggle" type="button" onclick="toggleModalSize()" title="크게 보기" aria-label="크게 보기" class="h-8 px-2.5 rounded-xl bg-zinc-200 dark:bg-zinc-900 hover:bg-zinc-300 dark:hover:bg-zinc-800 flex items-center justify-center space-x-1.5 text-zinc-600 dark:text-zinc-400 transition cursor-pointer">
                        <i id="sizeIcon" class="fa-solid fa-expand text-xs"></i>
                        <span id="sizeLabel" class="text-xs font-semibold select-none">크게</span>
                    </button>
                    <button onclick="closeModal()" aria-label="닫기" class="w-8 h-8 rounded-xl bg-zinc-200 dark:bg-zinc-900 hover:bg-zinc-300 dark:hover:bg-zinc-800 flex items-center justify-center text-zinc-600 dark:text-zinc-400 transition cursor-pointer">
                        <i class="fa-solid fa-xmark text-sm"></i>
                    </button>
                </div>
            </div>
            <div class="p-6 md:p-8 overflow-y-auto space-y-6">
                <nav id="modalCrumbs" class="hidden flex-wrap items-center gap-1 text-xs text-zinc-500"></nav>
                <h1 id="modalTitle" class="text-2xl md:text-3xl font-bold tracking-tight"></h1>
                <div id="modalContent" class="text-zinc-700 dark:text-zinc-300 text-sm md:text-base leading-relaxed space-y-4"></div>
            </div>
        </div>
    </div>

    <footer class="border-t border-zinc-200 dark:border-zinc-800 py-8 text-center text-xs text-zinc-500 transition-colors">
        <p>&copy; 2026 TEABAEK_LAB. Notion Integrated. <span class="code-font opacity-60">build v10</span></p>
    </footer>

    <script>
        let posts = [];
        let menus = [];   // type=Menu 인 노션 페이지 (About 등)
        let categories = [];
        let currentView = 'categories';
        let selectedCategory = null;
        let currentSort = 'desc';
        let loadError = null;

        // 사용자/노션 데이터를 HTML에 넣을 때 반드시 이스케이프
        function esc(s) {
            return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        async function loadPosts(force) {
            const status = document.getElementById('syncStatus');
            status.innerText = 'Syncing...';
            loadError = null;
            try {
                const res = await fetch('/api/posts' + (force ? '?t=' + Date.now() : ''));
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || res.statusText);
                posts = data.posts;
                menus = data.menus || [];
                corpus = null;
                status.innerText = 'Notion Live Synced';
            } catch (e) {
                posts = [];
                loadError = e.message;
                status.innerText = 'Sync Error';
            }
            document.getElementById('postCount').innerText = posts.length;
            updateCategories();
            renderApp();
        }

        function updateCategories() {
            const catMap = {};
            posts.forEach(p => {
                const name = p.category || 'Uncategorized';
                if (!catMap[name]) catMap[name] = { name, count: 0, icon: getCategoryIcon(name) };
                catMap[name].count++;
            });
            categories = Object.values(catMap);
        }

        function getCategoryIcon(catName) {
            if (catName.includes('Vulnerability') || catName.includes('System')) return 'fa-shield-halved';
            if (catName.includes('CTF')) return 'fa-flag';
            return 'fa-code';
        }

        function sortPosts(list) {
            return [...list].sort((a, b) => {
                const dA = new Date((a.date || '').replace(/\//g, '-') || 0);
                const dB = new Date((b.date || '').replace(/\//g, '-') || 0);
                return currentSort === 'desc' ? dB - dA : dA - dB;
            });
        }

        const sortSelectHtml = () => `
            <div class="flex items-center space-x-2">
                <span class="text-xs text-zinc-500">정렬:</span>
                <select onchange="changeSort(this.value)" class="px-3 py-1.5 rounded-xl bg-white dark:bg-zinc-900 border border-zinc-300 dark:border-zinc-800 text-xs font-semibold focus:outline-none focus:border-emerald-500 cursor-pointer">
                    <option value="desc" ${currentSort === 'desc' ? 'selected' : ''}>최신순</option>
                    <option value="asc" ${currentSort === 'asc' ? 'selected' : ''}>오래된순</option>
                </select>
            </div>`;

        function postCardHtml(post) {
            return `
                <div onclick="openModal('${esc(post.id)}')" class="group bg-white dark:bg-zinc-900/50 border border-zinc-200 dark:border-zinc-800 rounded-3xl p-6 hover:border-emerald-500/50 transition-all duration-300 flex flex-col justify-between cursor-pointer shadow-sm hover:shadow-md hover:shadow-emerald-500/5">
                    <div>
                        <div class="flex items-center justify-between mb-4">
                            <span class="px-3 py-1 rounded-full bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 text-xs font-semibold code-font">${esc(post.category || 'Uncategorized')}</span>
                            <span class="text-xs text-zinc-400">${esc(post.date)}</span>
                        </div>
                        <h3 class="text-lg font-bold tracking-tight mb-2 group-hover:text-emerald-500 transition">${esc(post.icon)} ${esc(post.title)}</h3>
                        <p class="text-zinc-600 dark:text-zinc-400 text-sm leading-relaxed mb-6">${esc(post.summary)}</p>
                    </div>
                    <div class="flex items-center text-xs font-semibold text-emerald-600 dark:text-emerald-400 space-x-1">
                        <span>펼쳐보기</span>
                        <i class="fa-solid fa-arrow-right text-[10px] transform group-hover:translate-x-1 transition"></i>
                    </div>
                </div>`;
        }

        function renderApp() {
            const container = document.getElementById('contentArea');
            if (!container) return;

            if (loadError) {
                container.innerHTML = `
                    <div class="p-6 rounded-3xl border border-rose-500/30 bg-rose-500/5 text-sm">
                        <p class="font-semibold text-rose-500 mb-2"><i class="fa-solid fa-triangle-exclamation mr-2"></i>노션 데이터를 불러오지 못했습니다.</p>
                        <p class="text-zinc-600 dark:text-zinc-400 break-words">${esc(loadError)}</p>
                        <p class="text-xs text-zinc-500 mt-3">Vercel 환경 변수(NOTION_TOKEN, NOTION_DATABASE_ID)와 노션 DB의 연결(Integration 초대)을 확인해주세요.</p>
                    </div>`;
                return;
            }

            if (currentView === 'categories') {
                let html = `
                    <div class="mb-6 flex items-center justify-between">
                        <h2 class="text-xl font-bold tracking-tight flex items-center space-x-2">
                            <i class="fa-solid fa-folder-tree text-emerald-500"></i><span>Categories</span>
                        </h2>
                        <span class="hidden sm:inline text-xs text-zinc-500">카테고리를 선택해 포스트를 확인하세요</span>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-12">`;

                categories.forEach((cat, i) => {
                    html += `
                        <div onclick="selectCategory(${i})" class="group bg-white dark:bg-zinc-900/50 border border-zinc-200 dark:border-zinc-800 rounded-3xl p-6 hover:border-emerald-500/50 transition-all duration-300 cursor-pointer shadow-sm hover:shadow-md hover:shadow-emerald-500/5 flex flex-col justify-between">
                            <div>
                                <div class="w-12 h-12 rounded-2xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-500 mb-6 group-hover:scale-110 transition">
                                    <i class="fa-solid ${cat.icon} text-lg"></i>
                                </div>
                                <h3 class="text-lg font-bold tracking-tight mb-2 group-hover:text-emerald-500 transition">${esc(cat.name)}</h3>
                                <p class="text-zinc-600 dark:text-zinc-400 text-sm leading-relaxed mb-6">노션 연동 시큐리티 아카이브 데이터베이스.</p>
                            </div>
                            <div class="flex items-center justify-between pt-4 border-t border-zinc-100 dark:border-zinc-800/60 text-xs font-semibold">
                                <span class="text-zinc-500 dark:text-zinc-400">${cat.count} Articles</span>
                                <span class="text-emerald-600 dark:text-emerald-400 flex items-center space-x-1">
                                    <span>Explore</span>
                                    <i class="fa-solid fa-arrow-right text-[10px] transform group-hover:translate-x-1 transition"></i>
                                </span>
                            </div>
                        </div>`;
                });
                html += `</div>`;

                html += `
                    <div class="mb-6 flex items-center justify-between flex-wrap gap-4 pt-6 border-t border-zinc-200 dark:border-zinc-800">
                        <h2 class="text-xl font-bold tracking-tight flex items-center space-x-2">
                            <i class="fa-solid fa-list text-emerald-500"></i><span>All Posts (전체 글)</span>
                        </h2>
                        ${sortSelectHtml()}
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">`;

                const all = sortPosts(posts);
                html += all.length
                    ? all.map(postCardHtml).join('')
                    : `<div class="col-span-2 py-12 text-center text-zinc-500 text-sm">등록된 포스트가 없습니다.</div>`;
                html += `</div>`;
                container.innerHTML = html;

            } else {
                const filtered = sortPosts(posts.filter(p => (p.category || 'Uncategorized') === selectedCategory));
                container.innerHTML = `
                    <div class="mb-8 flex items-center justify-between flex-wrap gap-4">
                        <button onclick="resetToHome()" class="inline-flex items-center space-x-2 px-4 py-2 rounded-xl bg-zinc-200 dark:bg-zinc-900 hover:bg-zinc-300 dark:hover:bg-zinc-800 text-zinc-800 dark:text-zinc-200 text-xs font-semibold transition border border-zinc-300 dark:border-zinc-800 cursor-pointer">
                            <i class="fa-solid fa-arrow-left"></i><span>전체 카테고리로 돌아가기</span>
                        </button>
                        <div class="flex items-center space-x-4">
                            ${sortSelectHtml()}
                            <div class="inline-flex items-center space-x-2 px-3 py-1 rounded-full bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 text-xs font-semibold code-font">
                                <span>CATEGORY: ${esc(selectedCategory)}</span>
                            </div>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        ${filtered.length ? filtered.map(postCardHtml).join('') : '<div class="col-span-2 py-16 text-center text-zinc-500 text-sm">등록된 포스트가 없습니다.</div>'}
                    </div>`;
            }
        }

        function changeSort(v) { currentSort = v; renderApp(); }

        function selectCategory(i) {
            currentView = 'posts';
            selectedCategory = categories[i].name;
            renderApp();
            window.scrollTo({ top: 200, behavior: 'smooth' });
        }

        function resetToHome() {
            currentView = 'categories';
            selectedCategory = null;
            renderApp();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 글/하위 페이지 공통 로더 (페이지 안의 페이지로 계속 이동 가능)
        async function openModal(postId, fallbackTitle) {
            const meta = posts.find(p => p.id === postId);
            const crumbs = document.getElementById('modalCrumbs');
            const content = document.getElementById('modalContent');

            if (meta) {
                document.getElementById('modalCategory').innerText = meta.category || 'Uncategorized';
                document.getElementById('modalDate').innerText = meta.date;
            } else {
                document.getElementById('modalCategory').innerText = '';
                document.getElementById('modalDate').innerText = '';
            }
            document.getElementById('modalTitle').innerText = meta ? meta.title : (fallbackTitle || '');
            crumbs.classList.add('hidden');
            content.innerHTML =
                '<p class="text-zinc-500"><i class="fa-solid fa-spinner fa-spin mr-2"></i>불러오는 중...</p>';
            document.getElementById('postModal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
            content.closest('.overflow-y-auto').scrollTop = 0;

            try {
                const res = await fetch('/api/post?id=' + encodeURIComponent(postId));
                const raw = await res.text();
                let data;
                try { data = JSON.parse(raw); }
                catch (_) { throw new Error(`서버가 JSON이 아닌 응답을 보냈습니다 (HTTP ${res.status}): ${raw.slice(0, 120).replace(/\s+/g, ' ')}`); }
                if (!res.ok) throw new Error(data.error || res.statusText);
                if (!data.post) throw new Error('응답에 post 데이터가 없습니다.');
                const post = data.post;

                const underMenu = /^menu$/i.test(post.rootType || '');
                const menuLabel = /^about$/i.test(post.rootSlug || '') ? 'ABOUT ME' : 'MENU';
                document.getElementById('modalCategory').innerText =
                    (post.isSubPage ? 'SUB PAGE · ' : '') + (underMenu ? menuLabel : (post.category || 'Uncategorized'));
                document.getElementById('modalDate').innerText = underMenu ? '' : (post.date || '');
                document.getElementById('modalTitle').innerText = post.title || '제목 없음';

                // breadcrumb: 루트 > 중간 페이지 > (현재)
                if (post.path && post.path.length) {
                    crumbs.innerHTML = post.path.map(p =>
                        `<button type="button" data-page-id="${esc(p.id)}" data-title="${esc(p.title)}" class="hover:text-emerald-500 underline-offset-2 hover:underline cursor-pointer">${esc(p.title)}</button><i class="fa-solid fa-chevron-right text-[8px] mx-1"></i>`
                    ).join('') + `<span class="text-zinc-700 dark:text-zinc-300">${esc(post.title || '제목 없음')}</span>`;
                    crumbs.classList.remove('hidden');
                    crumbs.classList.add('flex');
                }

                // content 는 서버에서 이스케이프 후 생성된 HTML
                const types = Object.entries(post.blockTypes || {}).map(([k, v]) => `${esc(k)}×${v}`).join(', ') || '없음';
                const diag = `<p class="text-xs text-zinc-400 code-font mt-4 break-all">진단: API ${esc(post.version || '구버전')} · 블록 ${types}${(post.unsupported || []).length ? ' · 미지원 ' + esc(post.unsupported.join(', ')) : ''}</p>`;

                if (post.empty) {
                    content.innerHTML = `<p class="text-zinc-500">이 페이지에 표시할 내용이 없습니다.</p>` + diag;
                } else {
                    content.innerHTML = post.content;
                    // 어떤 경우에도 빈 화면이 되지 않도록 최종 확인
                    const hasVisible = content.textContent.trim() || content.querySelector('img, button, table, hr');
                    if (!hasVisible) {
                        content.innerHTML = `<p class="text-zinc-500">표시할 수 있는 내용이 없습니다.</p>` + diag;
                    } else if (new URLSearchParams(location.search).has('debug')) {
                        content.insertAdjacentHTML('beforeend', diag);
                    }
                }
            } catch (e) {
                content.innerHTML =
                    `<p class="text-rose-500">본문을 불러오지 못했습니다: ${esc(e.message)}</p>`;
            }
        }

        // 본문 안의 하위 페이지 버튼 / breadcrumb 클릭 → 해당 페이지 열기
        ['modalContent', 'modalCrumbs'].forEach(id => {
            document.getElementById(id).addEventListener('click', e => {
                const btn = e.target.closest('[data-page-id]');
                if (!btn) return;
                openModal(btn.dataset.pageId, btn.dataset.title || btn.innerText.trim());
            });
        });

        // 본문 이미지(GIF 등)를 찾지 못하면 깨진 아이콘 대신 안내를 보여준다
        document.getElementById('modalContent').addEventListener('error', e => {
            const img = e.target;
            if (!img || img.tagName !== 'IMG' || img.dataset.failed) return;
            img.dataset.failed = '1';
            const note = document.createElement('p');
            note.className = 'text-xs text-rose-500';
            const name = img.getAttribute('alt') || img.getAttribute('src') || '';
            note.textContent = '이미지를 찾을 수 없습니다: ' + name + ' (GitHub 저장소의 images 폴더에 올렸는지, 파일 이름이 같은지 확인하세요)';
            (img.closest('figure') || img).replaceWith(note);
        }, true);

        // About: 노션 DB 에서 type=Menu, slug=about 인 페이지를 보여준다 (없으면 기본 소개)
        function findAboutMenu() {
            return menus.find(m => /^about$/i.test(m.slug || '')) || menus.find(m => /about|소개/i.test(m.title || ''));
        }

        function openAbout() {
            const m = findAboutMenu();
            if (m) { openModal(m.id, m.title || 'About'); return; }
            openAboutModal();
        }

        function openAboutModal() {
            document.getElementById('modalCategory').innerText = 'ABOUT ME';
            document.getElementById('modalDate').innerText = '';
            document.getElementById('modalTitle').innerText = 'TEABAEK_LAB';
            document.getElementById('modalCrumbs').classList.add('hidden');
            document.getElementById('modalContent').innerHTML = `
                <p class="font-semibold text-emerald-500">안녕하세요! TEABAEK_LAB입니다.</p>
                <p>공부한 내용을 노션에 기록하고, 이 사이트에 자동으로 보여줍니다.</p>
                <p class="text-xs text-zinc-400">자기소개는 노션 데이터베이스에 type을 Menu, slug를 about으로 한 페이지를 만들면 이 자리에 표시됩니다.</p>`;
            document.getElementById('postModal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        // ---------- 카테고리 드롭다운 ----------
        function renderCategoryMenu() {
            const row = (onclick, icon, label, count, active) => `
                <button type="button" onclick="${onclick}" class="w-full flex items-center justify-between gap-3 px-3 py-2 rounded-xl text-sm text-left hover:bg-emerald-500/10 hover:text-emerald-500 transition cursor-pointer ${active ? 'text-emerald-500 font-semibold bg-emerald-500/10' : 'text-zinc-700 dark:text-zinc-300'}">
                    <span class="flex items-center min-w-0"><i class="fa-solid ${icon} w-5 text-xs shrink-0"></i><span class="truncate">${esc(label)}</span></span>
                    <span class="text-xs text-zinc-400 shrink-0">${count}</span>
                </button>`;
            let html = row('chooseCategory(-1)', 'fa-layer-group', '전체 보기', posts.length, currentView === 'categories');
            categories.forEach((c, i) => {
                html += row(`chooseCategory(${i})`, c.icon, c.name, c.count, currentView === 'posts' && selectedCategory === c.name);
            });
            if (!categories.length) html += '<p class="px-3 py-2 text-xs text-zinc-500">카테고리가 없습니다.</p>';
            document.getElementById('catMenu').innerHTML = html;
        }

        function toggleCategoryMenu(e) {
            if (e) e.stopPropagation();
            const menu = document.getElementById('catMenu');
            const willOpen = menu.classList.contains('hidden');
            closeSearchPanel();
            if (willOpen) { renderCategoryMenu(); menu.classList.remove('hidden'); } else { menu.classList.add('hidden'); }
            document.getElementById('catBtn').setAttribute('aria-expanded', String(willOpen));
        }

        function closeCategoryMenu() {
            document.getElementById('catMenu').classList.add('hidden');
            document.getElementById('catBtn').setAttribute('aria-expanded', 'false');
        }

        function chooseCategory(i) {
            closeCategoryMenu();
            if (i < 0) resetToHome(); else selectCategory(i);
        }

        // ---------- 검색 (제목 · 요약 · 태그 · 카테고리 · 하위 페이지 본문) ----------
        let corpus = null;          // 검색 대상 목록 (글 + 하위 페이지)
        let searchIndex = null;     // /api/search-index 응답
        let indexState = 'idle';    // idle | loading | ready | error
        let searchTimer = null;

        const searchEls = () => ({
            wrap: document.getElementById('searchWrap'),
            input: document.getElementById('searchInput'),
            panel: document.getElementById('searchPanel'),
            status: document.getElementById('searchStatus'),
            results: document.getElementById('searchResults'),
        });

        async function ensureSearchIndex() {
            if (indexState === 'loading' || indexState === 'ready') return;
            indexState = 'loading';
            runSearch();
            try {
                const res = await fetch('/api/search-index');
                const raw = await res.text();
                let data; try { data = JSON.parse(raw); } catch (_) { throw new Error('JSON이 아닌 응답'); }
                if (!res.ok) throw new Error(data.error || res.statusText);
                searchIndex = data;
                corpus = null;
                indexState = 'ready';
            } catch (e) {
                indexState = 'error';
            }
            runSearch();
        }

        function buildCorpus() {
            const map = new Map();
            posts.forEach(p => map.set(p.id, { id: p.id, title: p.title || '', summary: p.summary || '', tags: p.tags || '', category: p.category || '', date: p.date || '', path: [], text: '' }));
            if (searchIndex) searchIndex.entries.forEach(e => {
                const x = map.get(e.id);
                if (x) x.text = e.text || '';
                else map.set(e.id, { id: e.id, title: e.title || '', summary: '', tags: '', category: '', date: '', path: e.path || [], text: e.text || '' });
            });
            corpus = [...map.values()].map(x => Object.assign(x, {
                _t: x.title.toLowerCase(), _s: x.summary.toLowerCase(), _g: x.tags.toLowerCase(),
                _c: x.category.toLowerCase(), _x: x.text.toLowerCase(), _p: x.path.join(' ').toLowerCase(),
            }));
            return corpus;
        }

        function highlight(str, tokens) {
            const re = new RegExp('(' + tokens.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'gi');
            return str.split(re).map((part, i) => i % 2 ? '<mark>' + esc(part) + '</mark>' : esc(part)).join('');
        }

        function makeSnippet(item, tokens) {
            const src = item.text || item.summary || '';
            if (!src) return '';
            const low = src.toLowerCase();
            let pos = -1;
            tokens.forEach(t => { const i = low.indexOf(t); if (i >= 0 && (pos < 0 || i < pos)) pos = i; });
            const start = Math.max(0, (pos < 0 ? 0 : pos) - 30);
            const seg = src.slice(start, start + 110).replace(/\s+/g, ' ');
            return (start > 0 ? '…' : '') + highlight(seg, tokens) + (start + 110 < src.length ? '…' : '');
        }

        function runSearch() {
            const { input, status, results } = searchEls();
            const q = input.value.trim();

            let note = '';
            if (indexState === 'loading') note = '본문까지 검색할 준비 중… (처음 한 번은 조금 걸릴 수 있어요)';
            else if (indexState === 'error') note = '본문 검색을 불러오지 못해 제목·요약·태그만 검색합니다.';
            else if (indexState === 'ready' && searchIndex.partial) note = '일부 하위 페이지는 아직 색인 중이라 검색에서 빠질 수 있어요.';

            if (!q) {
                status.textContent = note || '제목, 요약, 태그, 하위 페이지 본문을 검색합니다.';
                results.innerHTML = '';
                return;
            }

            const tokens = q.toLowerCase().split(/\s+/).filter(Boolean);
            const list = (corpus || buildCorpus()).map(it => {
                const hay = it._t + ' ' + it._s + ' ' + it._g + ' ' + it._c + ' ' + it._x + ' ' + it._p;
                if (!tokens.every(t => hay.includes(t))) return null;
                let score = 0;
                tokens.forEach(t => {
                    if (it._t.includes(t)) score += 10;
                    if (it._g.includes(t)) score += 5;
                    if (it._c.includes(t)) score += 3;
                    if (it._s.includes(t)) score += 2;
                    if (it._x.includes(t)) score += 1;
                });
                return { it, score };
            }).filter(Boolean).sort((a, b) => b.score - a.score).slice(0, 30);

            status.textContent = (list.length ? `검색 결과 ${list.length}개` : '검색 결과가 없습니다.') + (note ? ' · ' + note : '');
            results.innerHTML = list.map(({ it }) => {
                const meta = [it.category, it.tags].filter(Boolean).join(' · ');
                const snippet = makeSnippet(it, tokens);
                return `
                    <button type="button" data-sid="${esc(it.id)}" data-stitle="${esc(it.title)}" class="w-full text-left px-4 py-3 hover:bg-emerald-500/10 focus:bg-emerald-500/10 focus:outline-none transition border-b border-zinc-100 dark:border-zinc-800/60 last:border-0 cursor-pointer">
                        ${it.path.length ? `<div class="text-[11px] text-zinc-400 mb-0.5 truncate">${it.path.map(esc).join(' › ')}</div>` : ''}
                        <div class="text-sm font-semibold">${highlight(it.title || '제목 없음', tokens)}</div>
                        ${meta ? `<div class="text-[11px] text-emerald-600 dark:text-emerald-400 mt-0.5">${esc(meta)}</div>` : ''}
                        ${snippet ? `<div class="text-xs text-zinc-500 dark:text-zinc-400 mt-1 leading-relaxed">${snippet}</div>` : ''}
                    </button>`;
            }).join('');
        }

        function openSearchPanel() {
            closeCategoryMenu();
            searchEls().panel.classList.remove('hidden');
            ensureSearchIndex();
            runSearch();
        }

        function closeSearchPanel() {
            const { wrap, panel } = searchEls();
            panel.classList.add('hidden');
            wrap.classList.remove('search-open');
        }

        function toggleMobileSearch(e) {
            if (e) e.stopPropagation();
            const { wrap, input } = searchEls();
            const willOpen = !wrap.classList.contains('search-open');
            if (willOpen) { wrap.classList.add('search-open'); input.focus(); openSearchPanel(); }
            else closeSearchPanel();
        }

        (function initSearch() {
            const { input, results } = searchEls();
            input.addEventListener('focus', openSearchPanel);
            input.addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(runSearch, 120); });
            input.addEventListener('keydown', e => {
                const first = () => results.querySelector('[data-sid]');
                if (e.key === 'Enter') { e.preventDefault(); const b = first(); if (b) b.click(); }
                else if (e.key === 'ArrowDown') { e.preventDefault(); const b = first(); if (b) b.focus(); }
            });
            results.addEventListener('keydown', e => {
                const btn = e.target.closest('[data-sid]');
                if (!btn) return;
                if (e.key === 'ArrowDown') { e.preventDefault(); const n = btn.nextElementSibling; if (n) n.focus(); }
                else if (e.key === 'ArrowUp') { e.preventDefault(); const p = btn.previousElementSibling; (p || input).focus(); }
            });
            results.addEventListener('click', e => {
                const btn = e.target.closest('[data-sid]');
                if (!btn) return;
                closeSearchPanel();
                openModal(btn.dataset.sid, btn.dataset.stitle);
            });
            // 바깥을 누르면 검색 결과/카테고리 메뉴 닫기
            document.addEventListener('click', e => {
                if (!e.target.closest('#searchWrap') && !e.target.closest('#searchToggle')) closeSearchPanel();
                if (!e.target.closest('#catWrap')) closeCategoryMenu();
            });
        })();

        // 창 크기: 작게(기본) ↔ 크게(화면 90%)
        let modalLarge = false;

        function applyModalSize() {
            const panel = document.getElementById('modalPanel');
            panel.style.width = modalLarge ? 'max(90vw, min(100%, 42rem))' : '';
            panel.style.maxWidth = modalLarge ? '100%' : '';
            panel.style.maxHeight = modalLarge ? '92vh' : '';
            // 버튼은 "눌렀을 때 바뀔 상태"를 보여준다
            document.getElementById('sizeLabel').textContent = modalLarge ? '작게' : '크게';
            document.getElementById('sizeIcon').className = 'fa-solid text-xs ' + (modalLarge ? 'fa-compress' : 'fa-expand');
            const t = modalLarge ? '작게 보기' : '크게 보기';
            const btn = document.getElementById('sizeToggle');
            btn.title = t; btn.setAttribute('aria-label', t);
        }

        function toggleModalSize() {
            modalLarge = !modalLarge;
            applyModalSize();
        }

        function closeModal() {
            document.getElementById('postModal').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') {
                closeModal(); closeCategoryMenu(); closeSearchPanel();
                if (document.activeElement === document.getElementById('searchInput')) document.activeElement.blur();
            } else if (e.key === '/' && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) {
                e.preventDefault();
                const wrap = document.getElementById('searchWrap');
                if (getComputedStyle(wrap).display === 'none') toggleMobileSearch(); else document.getElementById('searchInput').focus();
            }
        });

        function toggleTheme() {
            const html = document.documentElement;
            const icon = document.getElementById('themeIcon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark'); html.classList.add('light');
                icon.className = 'fa-solid fa-sun text-sm text-amber-500';
            } else {
                html.classList.remove('light'); html.classList.add('dark');
                icon.className = 'fa-solid fa-moon text-sm text-emerald-400';
            }
        }

        window.onload = () => { applyModalSize(); loadPosts(); };
    </script>
</body>
</html>
